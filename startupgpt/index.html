<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Name Generator — Reza Ramji</title>
  <meta name="description" content="Retrained karpathy's microgpt on startup names.">
  <link rel="canonical" href="https://rezaramji.com/startupgpt/">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/site.css">
  <style>
    #bar { display: flex; gap: .6rem; margin: 1.4rem 0 .35rem; }
    #inp { flex: 1; font: inherit; font-size: 16px; padding: .45rem .6rem; border: 1px solid rgba(0,0,0,.25); border-radius: 6px; background: #fff; color: var(--ink); min-width: 0; }
    #die { font: inherit; font-size: 20px; line-height: 1; padding: .45rem .8rem; min-height: 40px; min-width: 48px; border: 1px solid rgba(0,0,0,.25); border-radius: 6px; background: #fff; cursor: pointer; transition: color .25s, border-color .25s; }
    #die:hover { border-color: var(--accent); }
    #flag { color: var(--accent); font-style: italic; min-height: 1.3em; margin: 0; }
    .fine { color: var(--muted); margin: .1rem 0 1.2rem; }
    #out { list-style: none; padding: 0; margin: .8rem 0; }
    #out li { font-size: 1.25rem; margin: .35rem 0; cursor: pointer; }
    #out li:hover { color: var(--accent); }
  </style>
</head>
<body>

  <header class="site">
    <div class="bar">
      <a class="brand" href="/">Reza Ramji</a>
      <nav class="top">
        <a href="/#home">home</a>
        <a href="/#projects/lm" class="active">projects</a>
        <a href="/#writing">writing</a>
        <a href="/#seealso">see also</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Startup Name Generator</h1>

    <div id="bar">
      <input id="inp" type="text" placeholder="type an idea…" autocomplete="off" spellcheck="false">
      <button id="die" title="roll a random name" aria-label="roll a random name">&#9860;</button>
    </div>
    <p id="flag"></p>
    <p class="fine">Retrained <a href="https://karpathy.ai/microgpt.html">karpathy's microgpt</a> on startup names</p>

    <ul id="out"></ul>
  </main>

  <script>
  (function () {
    const inp = document.getElementById('inp');
    const die = document.getElementById('die');
    const flag = document.getElementById('flag');
    const out = document.getElementById('out');
    let M = null, index = null, buckets = null, suffixes = null, suffixTotal = 0;
    const DRESS_P = 0.28; // fraction of the training names that carried a generic tag

    // ---- model ----
    function linear(x, W) {
      const o = new Array(W.length);
      for (let i = 0; i < W.length; i++) {
        let s = 0; const row = W[i];
        for (let j = 0; j < x.length; j++) s += row[j] * x[j];
        o[i] = s;
      }
      return o;
    }
    function softmax(v) {
      const mx = Math.max(...v);
      const e = v.map(x => Math.exp(x - mx));
      const t = e.reduce((a, b) => a + b, 0);
      return e.map(x => x / t);
    }
    function rmsnorm(x) {
      let ms = 0;
      for (const xi of x) ms += xi * xi;
      const sc = 1 / Math.sqrt(ms / x.length + 1e-5);
      return x.map(xi => xi * sc);
    }
    function gpt(tok, pos, keys, values) {
      const sd = M.state_dict, hd = M.n_embd / M.n_head;
      let x = sd.wte[tok].map((t, i) => t + sd.wpe[pos][i]);
      x = rmsnorm(x);
      for (let li = 0; li < M.n_layer; li++) {
        const xr = x;
        x = rmsnorm(x);
        const q = linear(x, sd['layer' + li + '.attn_wq']);
        keys[li].push(linear(x, sd['layer' + li + '.attn_wk']));
        values[li].push(linear(x, sd['layer' + li + '.attn_wv']));
        const K = keys[li], V = values[li], xa = [];
        for (let h = 0; h < M.n_head; h++) {
          const hs = h * hd, T = K.length, logits = new Array(T);
          for (let t = 0; t < T; t++) {
            let s = 0;
            for (let j = 0; j < hd; j++) s += q[hs + j] * K[t][hs + j];
            logits[t] = s / Math.sqrt(hd);
          }
          const w = softmax(logits);
          for (let j = 0; j < hd; j++) {
            let s = 0;
            for (let t = 0; t < T; t++) s += w[t] * V[t][hs + j];
            xa.push(s);
          }
        }
        x = linear(xa, sd['layer' + li + '.attn_wo']).map((v, i) => v + xr[i]);
        const xr2 = x;
        x = rmsnorm(x);
        x = linear(x, sd['layer' + li + '.mlp_fc1']).map(v => Math.max(0, v));
        x = linear(x, sd['layer' + li + '.mlp_fc2']).map((v, i) => v + xr2[i]);
      }
      return linear(x, sd.lm_head);
    }
    let charId = {};
    // avg surprisal (nats/char) of the typed text under the model
    function surprisal(prefix) {
      const BOS = M.uchars.length;
      const keys = [], values = [];
      for (let i = 0; i < M.n_layer; i++) { keys.push([]); values.push([]); }
      let tok = BOS, total = 0, n = 0;
      for (let pos = 0; pos < Math.min(prefix.length, M.block_size); pos++) {
        const probs = softmax(gpt(tok, pos, keys, values));
        const id = charId[prefix[pos]];
        total += -Math.log(probs[id] + 1e-12);
        n++;
        tok = id;
      }
      return n ? total / n : null;
    }
    function tintDie() {
      const key = cleanKey(inp.value);
      if (!M || !key) { die.style.color = ''; die.style.borderColor = ''; die.title = 'roll'; return; }
      const s = surprisal(key);
      const t = Math.max(0, Math.min(1, (s - 1.2) / 3));   // ~1.2 nats (basic) -> 4.2 (novel)
      const col = 'hsl(' + Math.round(120 * t) + ', 55%, 36%)'; // red = basic, green = novel
      die.style.color = col;
      die.style.borderColor = col;
      die.title = 'roll — input surprisal ' + s.toFixed(2) + ' nats/char';
    }

    // generate a name, optionally continuing a typed prefix
    function generate(prefix, temperature) {
      const BOS = M.uchars.length;
      const keys = [], values = [];
      for (let i = 0; i < M.n_layer; i++) { keys.push([]); values.push([]); }
      const toks = [BOS]; // start token always precedes whatever came from the textbox
      for (const ch of prefix) if (ch in charId) toks.push(charId[ch]);
      const outCh = prefix.split('').filter(c => c in charId);
      let pos = 0, logits = null;
      for (; pos < toks.length; pos++) logits = gpt(toks[pos], pos, keys, values);
      for (; pos < M.block_size; pos++) {
        const probs = softmax(logits.map(l => l / temperature));
        let r = Math.random(), next = probs.length - 1;
        for (let i = 0; i < probs.length; i++) { r -= probs[i]; if (r <= 0) { next = i; break; } }
        if (next === BOS) break;
        outCh.push(M.uchars[next]);
        if (pos === M.block_size - 1) break;
        logits = gpt(next, pos + 1, keys, values);
      }
      return outCh.join('');
    }

    // ---- index cross-check ----
    function editDistCapped(a, b, cap) {
      if (Math.abs(a.length - b.length) >= cap) return cap;
      let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
      for (let i = 1; i <= a.length; i++) {
        const cur = [i]; let best = cap;
        for (let j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          if (cur[j] < best) best = cur[j];
        }
        if (best >= cap) return cap;
        prev = cur;
      }
      return Math.min(prev[b.length], cap);
    }
    function nearIndex(name) { // is there a real startup within edit distance 2?
      for (let L = Math.max(2, name.length - 2); L <= name.length + 2; L++)
        for (const real of (buckets[L] || []))
          if (editDistCapped(name, real, 3) <= 2) return true;
      return false;
    }
    const cleanKey = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');

    // ---- dressing: weighted-random whether to tag, weighted-random which ----
    function dress(name) {
      const cap = name.charAt(0).toUpperCase() + name.slice(1);
      if (Math.random() >= DRESS_P) return cap;
      let r = Math.random() * suffixTotal;
      for (const k in suffixes) {
        r -= suffixes[k];
        if (r <= 0) return cap + ' ' + (k === 'ai' ? 'AI' : k.charAt(0).toUpperCase() + k.slice(1));
      }
      return cap;
    }

    // always exactly three names, regenerated from whatever is in the textbox
    let epoch = 0;
    async function regen() {
      if (!M) return;
      const my = ++epoch;
      const prefix = cleanKey(inp.value);
      const picked = [];
      let attempts = 0, fallback = null;
      while (picked.length < 3 && attempts < 100) {
        attempts++;
        if (attempts % 3 === 0) await new Promise(r => setTimeout(r, 0));
        if (my !== epoch) return; // a newer keystroke superseded this roll
        const name = generate(prefix, 0.8);
        if (name.length < 3) continue;
        if (index.has(name)) continue;                      // must be new
        if (picked.includes(name)) continue;
        if (prefix || nearIndex(name)) picked.push(name);   // unprefixed rolls must also stay near the index
        else if (!fallback) fallback = name;
      }
      if (!picked.length && fallback) picked.push(fallback);
      if (my !== epoch) return;
      out.innerHTML = '';
      for (const p of picked) {
        const li = document.createElement('li');
        li.textContent = dress(p);
        li.dataset.raw = p;
        out.appendChild(li);
      }
    }

    // clicking an idea sends it to the search bar
    out.addEventListener('click', e => {
      const li = e.target.closest('li');
      if (!li || !li.dataset.raw) return;
      inp.value = li.dataset.raw;
      inp.focus();
      updateFlag();
      tintDie();
      regen();
    });

    function updateFlag() {
      const key = cleanKey(inp.value);
      if (!key || !index) { flag.innerHTML = ''; return; }
      // quoted-name search, minus dictionary noise, to vet existing associations
      const q = encodeURIComponent('"' + key + '" -definition -define -dictionary -meaning -thesaurus -wiktionary');
      const link = '<a href="https://www.google.com/search?q=' + q + '" target="_blank" rel="noopener">google &ldquo;' + key + '&rdquo;</a>';
      flag.innerHTML = (index.has(key) ? '⚑ already exists &middot; ' : '') + link;
    }

    let deb;
    inp.addEventListener('input', () => {
      updateFlag();
      tintDie();
      clearTimeout(deb);
      deb = setTimeout(regen, 150);
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') regen(); });
    die.addEventListener('click', regen);

    Promise.all([
      fetch('model.json').then(r => r.json()),
      fetch('index.txt').then(r => r.text()),
      fetch('terms.json').then(r => r.json()),
    ]).then(([model, idx, terms]) => {
      M = model;
      M.uchars.forEach((c, i) => charId[c] = i);
      const names = idx.split('\n').filter(Boolean);
      index = new Set(names);
      buckets = {};
      for (const nm of names) (buckets[nm.length] = buckets[nm.length] || []).push(nm);
      suffixes = terms.suffix_frequency;
      for (const k in suffixes) suffixTotal += suffixes[k];
      inp.focus();
      regen(); // three names on arrival
    }).catch(() => { flag.textContent = 'failed to load the model — try a hard refresh'; });
  })();
  </script>
<script data-goatcounter="https://rezaramji.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
