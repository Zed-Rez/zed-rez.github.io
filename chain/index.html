<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listen to the Chain</title>
  <meta name="description" content="Real-time sonification of USDC transfers across nine blockchains.">
  <meta property="og:title" content="Listen to the Chain">
  <meta property="og:description" content="USDC transfers across nine blockchains, sonified in real time">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f4f1eb;
      color: #3a3530;
      font-family: 'EB Garamond', serif;
      overflow: hidden;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
    #ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    /* ─── compact header: single row ─── */
    #header {
      padding: 0.6em 1.2em 0.35em;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.15em 0.8em;
      background: linear-gradient(to bottom, rgba(244,241,235,0.96) 70%, transparent);
    }
    #header h1 {
      font-size: 0.9em;
      font-weight: 500;
      color: #2a2520;
      letter-spacing: 0.02em;
      margin-right: 0.3em;
      cursor: pointer;
      pointer-events: all;
      transition: opacity 0.3s;
    }
    #header h1:hover { opacity: 0.6; }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.25em;
      font-size: 0.7em;
      color: #5a5040;
      cursor: pointer;
      pointer-events: all;
      user-select: none;
      transition: opacity 0.3s;
    }
    .legend-item.muted { opacity: 0.2; text-decoration: line-through; }
    .legend-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #stats-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6em;
      margin-top: -0.1em;
    }
    #stats-line {
      font-size: 0.68em;
      color: #9a9080;
      font-style: italic;
    }
    #back-link {
      font-size: 0.68em;
      color: #b0a898;
      text-decoration: none;
      pointer-events: all;
      margin-left: auto;
      transition: color 0.3s;
    }
    #back-link:hover { color: #5a5040; }

    /* ─── full-height left log panel ─── */
    #log-panel {
      position: fixed;
      top: 3em;
      left: 0;
      bottom: 1.5em;
      width: fit-content;
      overflow-y: auto;
      pointer-events: all;
      padding: 0.4em 0.6em 0.5em 1.5em;
      background: linear-gradient(to right, rgba(244,241,235,0.88) 95%, transparent);
      display: flex;
      flex-direction: column;
      gap: 0.08em;
      scrollbar-width: thin;
      scrollbar-color: #d0c8b8 transparent;
      z-index: 10;
    }
    #log-panel.hidden {
      display: none !important;
    }
    #log-panel::-webkit-scrollbar { width: 3px; }
    #log-panel::-webkit-scrollbar-thumb { background: #d0c8b8; border-radius: 2px; }
    #log-panel::-webkit-scrollbar-track { background: transparent; }
    .tx {
      font-size: 0.76em;
      color: #5a5548;
      white-space: nowrap;
      opacity: 0;
      animation: txIn 0.3s ease forwards;
      flex-shrink: 0;
      line-height: 1.5;
    }
    .tx .chain-tag {
      display: inline-block;
      min-width: 3.2em;
      font-size: 0.85em;
      font-weight: 500;
      margin-right: 0.4em;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .tx .amt {
      color: #3a3530;
      display: inline-block;
      min-width: 6em;
      text-align: right;
      margin-right: 0.8em;
    }
    .tx .addr { color: #a09888; font-size: 0.9em; }
    .tx.whale .amt { color: #1a1510; font-weight: 500; }
    @keyframes txIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #status {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #b0a898;
      font-style: italic;
      font-size: 1.05em;
      transition: opacity 0.5s;
      z-index: 10;
      pointer-events: none;
    }
    #sim-badge {
      display: none;
      position: fixed;
      top: 4em;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72em;
      color: #b0a090;
      font-style: italic;
      z-index: 10;
    }
    #sources {
      position: fixed;
      bottom: 0.5em;
      left: 1.5em;
      font-size: 0.6em;
      color: #b8b0a0;
      pointer-events: all;
      z-index: 10;
    }
    #sources a { color: #908878; text-decoration: none; }
    #sources a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="ui">
    <div id="header">
      <h1>Listen to the Chain</h1>
      <!-- legend items injected here -->
      <div id="stats-row">
        <div id="stats-line"></div>
        <a href="/#projects/data" id="back-link">← back</a>
      </div>
    </div>
  </div>

  <div id="log-panel"></div>
  <div id="status">connecting…</div>
  <div id="sim-badge">simulated data</div>

  <div id="sources">
    data: <a href="https://developers.circle.com/stablecoins/usdc-contract-addresses" target="_blank">Circle USDC</a> ERC-20 Transfer logs ·
    RPCs: <a href="https://publicnode.com" target="_blank">PublicNode</a>,
    <a href="https://drpc.org" target="_blank">dRPC</a>,
    <a href="https://www.ankr.com/rpc/" target="_blank">Ankr</a>
  </div>

  <script>
    /* ─── chain config: native Circle USDC on all major EVM chains ─── */
    const CHAINS = [
      {
        id: 'ethereum', name: 'Ethereum', short: 'ETH',
        usdc: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48',
        rpcs: ['https://ethereum-rpc.publicnode.com','https://eth.drpc.org','https://rpc.ankr.com/eth','https://eth.llamarpc.com'],
        color: [80, 110, 195], pan: -0.9, baseNote: 0
      },
      {
        id: 'polygon', name: 'Polygon', short: 'POL',
        usdc: '0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359',
        rpcs: ['https://polygon-bor-rpc.publicnode.com','https://polygon.drpc.org','https://rpc.ankr.com/polygon'],
        color: [145, 40, 200], pan: -0.6, baseNote: 1
      },
      {
        id: 'arbitrum', name: 'Arbitrum', short: 'ARB',
        usdc: '0xaf88d065e77c8cC2239327C5EDb3A432268e5831',
        rpcs: ['https://arbitrum-one-rpc.publicnode.com','https://arbitrum.drpc.org','https://rpc.ankr.com/arbitrum'],
        color: [10, 160, 185], pan: -0.3, baseNote: 2
      },
      {
        id: 'optimism', name: 'Optimism', short: 'OPT',
        usdc: '0x0b2C639c533813f4Aa9D7837CAf62653d097Ff85',
        rpcs: ['https://optimism-rpc.publicnode.com','https://optimism.drpc.org','https://rpc.ankr.com/optimism'],
        color: [220, 30, 35], pan: -0.1, baseNote: 3
      },
      {
        id: 'base', name: 'Base', short: 'BASE',
        usdc: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913',
        rpcs: ['https://base-rpc.publicnode.com','https://base.drpc.org','https://rpc.ankr.com/base'],
        color: [20, 70, 235], pan: 0.1, baseNote: 4
      },
      {
        id: 'avalanche', name: 'Avalanche', short: 'AVAX',
        usdc: '0xB97EF9Ef8734C71904D8002F8b6Bc66Dd9c48a6E',
        rpcs: ['https://avalanche-c-chain-rpc.publicnode.com','https://avalanche.drpc.org','https://rpc.ankr.com/avalanche'],
        color: [220, 100, 20], pan: 0.3, baseNote: 5
      },
      {
        id: 'celo', name: 'Celo', short: 'CELO',
        usdc: '0xcebA9300f2b948710d2653dD7B07f33A8B32118C',
        rpcs: ['https://forno.celo.org','https://celo.drpc.org','https://rpc.ankr.com/celo'],
        color: [30, 165, 60], pan: 0.5, baseNote: 6
      },
      {
        id: 'zksync', name: 'zkSync', short: 'ZK',
        usdc: '0x1d17CBcF0D6D143135aE902365D2E5e2A16538D4',
        rpcs: ['https://mainnet.era.zksync.io','https://zksync.drpc.org','https://rpc.ankr.com/zksync_era'],
        color: [170, 65, 155], pan: 0.7, baseNote: 7
      },
      {
        id: 'sonic', name: 'Sonic', short: 'SONIC',
        usdc: '0x29219dd400f2Bf60E5a23d13Be72B486D4038894',
        rpcs: ['https://rpc.soniclabs.com','https://sonic.drpc.org'],
        color: [175, 155, 15], pan: 0.9, baseNote: 8
      }
    ];

    const TRANSFER = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
    const ZERO_ADDR = '0x0000000000000000000000000000000000000000';

    /* pentatonic C major across 5 octaves for dramatic pitch range */
    const PENTATONIC = [
      65.41, 73.42, 82.41, 98.00, 110.00,
      130.81, 146.83, 164.81, 196.00, 220.00,
      261.63, 293.66, 329.63, 392.00, 440.00,
      523.25, 587.33, 659.26, 783.99, 880.00,
      1046.50, 1174.66, 1318.51, 1567.98, 1760.00
    ];

    let canvasCtx, cvs, dpr;
    let audio, master, comp, verb, verbGain;
    let bubbles = [];
    let mutedChains = new Set();

    /* rolling stats: { time, amount, chainId } */
    let recentTxs = [];

    const chainState = {};
    for (const ch of CHAINS) {
      chainState[ch.id] = {
        rpcIdx: 0, lastBlock: null,
        seen: new Set(), pollFails: 0,
        simulating: false, simInterval: null,
        connected: false
      };
    }

    /* ─── utilities ─── */
    const lerp = (v, a, b, c, d) => c + (d - c) * ((v - a) / (b - a));
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const fmt = n => n >= 1e6 ? `$${(n/1e6).toFixed(1)}M` : n >= 1e3 ? `$${(n/1e3).toFixed(1)}K` : n >= 1 ? `$${n.toFixed(0)}` : `$${n.toFixed(2)}`;
    const shortAddr = a => a.slice(0, 6) + '…' + a.slice(-4);
    const randAddr = () => '0x' + Array.from({length:40}, () => '0123456789abcdef'[Math.random()*16|0]).join('');
    const rgb = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

    /* ─── audio ─── */
    function initAudio() {
      audio = new (window.AudioContext || window.webkitAudioContext)();

      comp = audio.createDynamicsCompressor();
      comp.threshold.value = -22;
      comp.knee.value = 20;
      comp.ratio.value = 12;
      comp.attack.value = 0.003;
      comp.release.value = 0.2;

      master = audio.createGain();
      master.gain.value = 0.6;   /* max volume, no slider */

      const len = audio.sampleRate * 3;
      const impulse = audio.createBuffer(2, len, audio.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = impulse.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
        }
      }
      verb = audio.createConvolver();
      verb.buffer = impulse;

      verbGain = audio.createGain();
      verbGain.gain.value = 0.22;

      comp.connect(master);
      verb.connect(verbGain);
      verbGain.connect(master);
      master.connect(audio.destination);
    }

    let lastToneTime = 0;
    function playTone(amount, chain) {
      if (!audio || audio.state === 'suspended') return;
      if (mutedChains.has(chain.id)) return;
      /* minimum 50ms between tones to prevent overload */
      const wall = Date.now();
      if (wall - lastToneTime < 50) return;
      lastToneTime = wall;

      const now = audio.currentTime;
      const lg = Math.log10(Math.max(amount, 0.01));
      /* map across 5-octave pentatonic: large=$→low, small$→high */
      const ni = clamp(Math.round(lerp(lg, -1, 8, PENTATONIC.length - 1, 0)), 0, PENTATONIC.length - 1);
      const freq = PENTATONIC[ni];
      const dur = lerp(lg, -1, 8, 0.4, 4.0);
      const vol = lerp(lg, -1, 8, 0.03, 0.16);

      const panner = audio.createStereoPanner();
      panner.pan.value = chain.pan;

      const makeOsc = (f, gain, decayMul) => {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(gain, now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur * decayMul);
        o.connect(g);
        g.connect(panner);
        panner.connect(comp);
        panner.connect(verb);
        o.start(now);
        o.stop(now + dur * decayMul + 0.05);
      };

      const h2 = [0.22, 0.30, 0.15, 0.25, 0.18, 0.28, 0.20, 0.24, 0.16][chain.baseNote] || 0.22;
      const h3 = [0.08, 0.04, 0.12, 0.06, 0.10, 0.05, 0.09, 0.07, 0.11][chain.baseNote] || 0.08;
      const decay = [1.0, 0.85, 1.1, 0.9, 1.05, 0.8, 0.95, 1.0, 0.88][chain.baseNote] || 1.0;

      makeOsc(freq, vol, decay);
      makeOsc(freq * 2, vol * h2, 0.55 * decay);
      makeOsc(freq * 3, vol * h3, 0.3 * decay);

      if (amount >= 500000) {
        makeOsc(freq * 1.5, vol * 0.15, 0.8 * decay);
      }
    }

    /* ─── canvas ─── */
    function initCanvas() {
      cvs = document.getElementById('c');
      canvasCtx = cvs.getContext('2d');
      resize();
      window.addEventListener('resize', resize);
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      cvs.width = window.innerWidth * dpr;
      cvs.height = window.innerHeight * dpr;
      cvs.style.width = window.innerWidth + 'px';
      cvs.style.height = window.innerHeight + 'px';
      canvasCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function addBubble(amount, chain) {
      if (amount < 1) return;
      if (mutedChains.has(chain.id)) return;
      const lg = Math.log10(Math.max(amount, 1));
      const r = clamp(lerp(lg, 0, 7, 4, 55), 4, 60);
      const w = window.innerWidth, h = window.innerHeight;
      const pad = r + 4;

      /* keep bubbles out of the left log panel (when visible) */
      const logPanel = document.getElementById('log-panel');
      const logRight = (logPanel && !logPanel.classList.contains('hidden'))
        ? logPanel.getBoundingClientRect().right : 0;
      const leftEdge = logRight > 0 ? logRight + pad : pad;
      const x = leftEdge + Math.random() * (w - leftEdge - pad);
      const y = pad + Math.random() * (h - pad * 2);

      bubbles.push({
        x, y,
        r: 0, tr: r,
        a: 0.8,
        born: Date.now(),
        life: lerp(lg, 0, 7, 3500, 8000),
        lg,
        color: chain.color,
        /* gentle bidirectional drift, clamped to viewport */
        vy: (Math.random() < 0.5 ? -1 : 1) * (0.005 + Math.random() * 0.015),
        vx: (Math.random() - 0.5) * 0.02
      });
    }

    function renderLoop() {
      const w = window.innerWidth, h = window.innerHeight;
      canvasCtx.clearRect(0, 0, w, h);
      const now = Date.now();

      bubbles = bubbles.filter(b => now - b.born < b.life);

      for (const b of bubbles) {
        const age = (now - b.born) / b.life;
        b.r = age < 0.06 ? b.tr * (age / 0.06) : b.tr;
        const alpha = age < 0.06
          ? (age / 0.06) * b.a
          : b.a * Math.pow(1 - (age - 0.06) / 0.94, 1.5);

        if (alpha < 0.002) continue;

        /* drift but clamp to viewport */
        b.x = clamp(b.x + b.vx, b.r + 4, w - b.r - 4);
        b.y = clamp(b.y + b.vy, b.r + 4, h - b.r - 4);

        const c = b.color;

        /* solid filled circle — high opacity for light bg */
        canvasCtx.beginPath();
        canvasCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        canvasCtx.fillStyle = rgb(c, alpha * 0.45);
        canvasCtx.fill();

        /* inner highlight for depth */
        const g = canvasCtx.createRadialGradient(
          b.x - b.r * 0.25, b.y - b.r * 0.25, 0,
          b.x, b.y, b.r
        );
        g.addColorStop(0, `rgba(255,255,255,${alpha * 0.35})`);
        g.addColorStop(0.6, `rgba(255,255,255,${alpha * 0.08})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        canvasCtx.beginPath();
        canvasCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        canvasCtx.fillStyle = g;
        canvasCtx.fill();

        /* crisp ring */
        canvasCtx.beginPath();
        canvasCtx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        canvasCtx.strokeStyle = rgb(c, alpha * 0.85);
        canvasCtx.lineWidth = 1.5;
        canvasCtx.stroke();
      }

      requestAnimationFrame(renderLoop);
    }

    /* ─── RPC ─── */
    async function chainRpc(chain, method, params) {
      const st = chainState[chain.id];
      const rpcs = chain.rpcs;
      for (let i = 0; i < rpcs.length; i++) {
        const url = rpcs[(st.rpcIdx + i) % rpcs.length];
        try {
          const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jsonrpc: '2.0', method, params: params || [], id: 1 })
          });
          const d = await r.json();
          if (d.error) throw new Error(d.error.message);
          st.rpcIdx = (st.rpcIdx + i) % rpcs.length;
          return d.result;
        } catch (e) {}
      }
      throw new Error(`${chain.name}: all RPCs failed`);
    }

    function parseLog(log) {
      const from = '0x' + log.topics[1].slice(26);
      const to = '0x' + log.topics[2].slice(26);
      const amount = Number(BigInt(log.data)) / 1e6;
      return { from, to, amount, hash: log.transactionHash, logIdx: log.logIndex, block: parseInt(log.blockNumber, 16) };
    }

    async function pollChain(chain) {
      const st = chainState[chain.id];
      try {
        const fromBlock = st.lastBlock
          ? '0x' + Math.max(st.lastBlock + 1, 0).toString(16)
          : 'latest';

        const logs = await chainRpc(chain, 'eth_getLogs', [{
          fromBlock, toBlock: 'latest',
          address: chain.usdc,
          topics: [TRANSFER]
        }]);

        const fresh = [];
        let maxBlock = st.lastBlock || 0;
        for (const l of (logs || [])) {
          const key = l.transactionHash + l.logIndex;
          if (st.seen.has(key)) continue;
          st.seen.add(key);
          const tx = parseLog(l);
          tx.chain = chain;
          if (tx.amount > 0 && tx.from !== ZERO_ADDR && tx.to !== ZERO_ADDR) fresh.push(tx);
          if (tx.block > maxBlock) maxBlock = tx.block;
        }

        if (st.seen.size > 3000) {
          const arr = [...st.seen];
          st.seen = new Set(arr.slice(-1500));
        }

        if (maxBlock > 0) st.lastBlock = maxBlock;
        st.pollFails = 0;
        st.connected = true;

        if (fresh.length) emitTxs(fresh, chain);
        updateConnectionStatus();

      } catch (e) {
        console.warn(`poll ${chain.name}:`, e.message);
        st.pollFails++;
        if (st.pollFails >= 4 && !st.simulating) startChainSim(chain);
        updateConnectionStatus();
      }
    }

    /*
     * Spread transactions uniformly over the poll interval (~5s)
     * so they flow in steadily rather than arriving in chunks.
     * The chunking is from the API (we poll every ~5s and get a batch),
     * so we distribute them evenly with slight jitter for natural feel.
     */
    const POLL_INTERVAL = 5000;

    function emitTxs(txs, chain) {
      /* deduplicate: one event per tx hash (a single swap/bridge
         can emit multiple Transfer events; keep the largest) */
      const byHash = new Map();
      for (const tx of txs) {
        const prev = byHash.get(tx.hash);
        if (!prev || tx.amount > prev.amount) byHash.set(tx.hash, tx);
      }
      txs = [...byHash.values()];

      /* shuffle for natural feel */
      for (let i = txs.length - 1; i > 0; i--) {
        const j = Math.random() * (i + 1) | 0;
        [txs[i], txs[j]] = [txs[j], txs[i]];
      }

      /* spread uniformly across the poll interval */
      const spacing = Math.max(40, POLL_INTERVAL / Math.max(txs.length, 1));
      const jitter = spacing * 0.3;

      txs.forEach((tx, i) => {
        const delay = i * spacing + (Math.random() - 0.5) * jitter;
        setTimeout(() => {
          if (mutedChains.has(chain.id)) return;
          /* all three media at once — no desync */
          addBubble(tx.amount, chain);
          if (tx.amount >= 1) addLogEntry(tx, chain);
          if (tx.amount >= 1) playTone(tx.amount, chain);
          /* track for stats */
          recentTxs.push({ time: Date.now(), amount: tx.amount, chainId: chain.id });
        }, Math.max(0, delay));
      });
    }

    /* ─── simulation fallback ─── */
    function startChainSim(chain) {
      const st = chainState[chain.id];
      st.simulating = true;
      document.getElementById('sim-badge').style.display = 'block';

      st.simInterval = setInterval(() => {
        const n = 1 + Math.random() * 4 | 0;
        const txs = [];
        for (let i = 0; i < n; i++) {
          const exp = Math.random() * 6 - 1;
          const amount = Math.pow(10, exp) * (0.5 + Math.random());
          txs.push({ from: randAddr(), to: randAddr(), amount, hash: randAddr(), block: 0, chain });
        }
        emitTxs(txs, chain);
      }, 5000 + Math.random() * 4000);

      const retryId = setInterval(async () => {
        try {
          await chainRpc(chain, 'eth_blockNumber');
          clearInterval(st.simInterval);
          clearInterval(retryId);
          st.simulating = false;
          st.pollFails = 0;
          st.lastBlock = null;
          st.connected = true;
          updateConnectionStatus();
          pollChain(chain);
        } catch (e) {}
      }, 30000);
    }

    function updateConnectionStatus() {
      const anyConnected = CHAINS.some(ch => chainState[ch.id].connected);
      const allSim = CHAINS.every(ch => chainState[ch.id].simulating);
      const statusEl = document.getElementById('status');
      const simEl = document.getElementById('sim-badge');
      statusEl.style.opacity = anyConnected ? '0' : '1';
      simEl.style.display = allSim ? 'block' : 'none';
    }

    /* ─── log panel (full height) with scroll-pause ─── */
    let logLive = true;

    /* detect user scroll: if they scroll down, pause; near top = live */
    document.getElementById('log-panel').addEventListener('scroll', () => {
      const log = document.getElementById('log-panel');
      logLive = log.scrollTop <= 5;
    });

    function addLogEntry(tx, chain) {
      if (mutedChains.has(chain.id)) return;
      const log = document.getElementById('log-panel');
      const el = document.createElement('div');
      el.className = 'tx' + (tx.amount >= 100000 ? ' whale' : '');
      el.dataset.chain = chain.id;
      el.innerHTML = `<span class="chain-tag" style="color:${rgb(chain.color, 0.9)}">${chain.short}</span><span class="amt">${fmt(tx.amount)}</span><span class="addr">${shortAddr(tx.from)} → ${shortAddr(tx.to)}</span>`;

      if (!logLive) {
        /* paused: add entry at top but adjust scroll so visible lines stay put */
        const prevH = log.scrollHeight;
        log.insertBefore(el, log.firstChild);
        log.scrollTop += log.scrollHeight - prevH;
      } else {
        log.insertBefore(el, log.firstChild);
      }

      while (log.children.length > 300) log.removeChild(log.lastChild);
    }

    /* ─── stats: synced to active (unmuted) chains ─── */
    let statsStartTime = Date.now();

    function updateStats() {
      const now = Date.now();
      const elapsed = (now - statsStartTime) / 1000; /* seconds since start */
      recentTxs = recentTxs.filter(t => now - t.time < 60000);

      /* wait 30s before showing rate so numbers are meaningful */
      if (elapsed < 30) {
        document.getElementById('stats-line').textContent = 'gathering data…';
        return;
      }

      /* only count unmuted chains */
      const active = recentTxs.filter(t => !mutedChains.has(t.chainId));
      const txCount = active.length;
      const flowTotal = active.reduce((s, t) => s + t.amount, 0);

      /* use actual window duration to compute per-minute rate */
      const windowSecs = Math.min(elapsed, 60);
      const txPerMin = Math.round(txCount / windowSecs * 60);
      const flowPerMin = flowTotal / windowSecs * 60;

      document.getElementById('stats-line').textContent =
        `${txPerMin.toLocaleString()} tx/min · ${fmt(flowPerMin)}/min`;
    }

    /* ─── legend (inline in header) ─── */
    function buildLegend() {
      const header = document.getElementById('header');
      const statsRow = document.getElementById('stats-row');

      for (const ch of CHAINS) {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.dataset.chain = ch.id;
        item.innerHTML = `<span class="legend-dot" style="background:${rgb(ch.color, 0.9)}"></span>${ch.name}`;
        item.addEventListener('click', () => {
          if (mutedChains.has(ch.id)) {
            mutedChains.delete(ch.id);
            item.classList.remove('muted');
          } else {
            mutedChains.add(ch.id);
            item.classList.add('muted');
            /* immediately purge this chain from all media */
            document.querySelectorAll(`.tx[data-chain="${ch.id}"]`).forEach(el => el.remove());
            const cc = JSON.stringify(ch.color);
            bubbles = bubbles.filter(b => JSON.stringify(b.color) !== cc);
          }
          updateStats();
        });
        header.insertBefore(item, statsRow);
      }
    }

    /* ─── boot ─── */
    buildLegend();

    /* ─── log toggle: click title to show/hide log panel ─── */
    let logVisible = true;
    document.querySelector('#header h1').addEventListener('click', (e) => {
      e.stopPropagation();
      logVisible = !logVisible;
      document.getElementById('log-panel').classList.toggle('hidden', !logVisible);
    });

    initCanvas();
    renderLoop();

    /* init audio eagerly (will be suspended until user gesture) */
    initAudio();

    CHAINS.forEach((chain, i) => {
      setTimeout(() => {
        pollChain(chain);
        setInterval(() => pollChain(chain), POLL_INTERVAL + i * 300);
      }, i * 600);
    });

    /* stats refresh */
    setInterval(updateStats, 2000);

    /* resume audio on first interaction + immediately re-poll for instant sound */
    let audioResumed = false;
    function resumeAudio() {
      if (audioResumed) return;
      if (audio && audio.state === 'suspended') {
        audio.resume().then(() => {
          audioResumed = true;
          /* re-poll all chains immediately so sound starts right away */
          CHAINS.forEach(ch => pollChain(ch));
        });
      } else {
        audioResumed = true;
      }
    }
    document.addEventListener('click', resumeAudio);
    document.addEventListener('keydown', resumeAudio);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (audio && audio.state === 'suspended') audio.resume();
        CHAINS.forEach(ch => pollChain(ch));
      }
    });
  </script>
